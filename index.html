<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #000;
            color: #39ff14;
            padding: 16px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .hidden {
            display: none !important;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
        }
        button {
            background: #004400;
            color: #39ff14;
            border: 1px solid #39ff14;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background: #006600;
        }
        .login-box, .add-form-box {
            border: 1px solid #39ff14;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            background: #111;
            border: 1px solid #39ff14;
            color: #39ff14;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
        }
        .search-area {
            margin-bottom: 16px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px;
        }
        .product-card {
            border: 1px solid #39ff14;
            padding: 14px;
            border-radius: 6px;
        }
        .product-card p {
            margin: 6px 0;
            font-size: 14px;
        }
        .del-btn {
            margin-top:8px;
            background:#440000;
            border-color:#ff4444;
            color:#ff4444;
        }
        .debug-popup {
            position: fixed;
            bottom:16px;
            right:16px;
            background:#111;
            border:1px solid #39ff14;
            padding:12px;
            max-width:320px;
            z-index:999;
            font-size:12px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Login View -->
    <div id="loginView">
        <div class="login-box">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="doLogin()">Login</button>
        </div>
    </div>

    <!-- Main System View -->
    <div id="mainView" class="hidden">
        <div class="header-bar">
            <h1>Product Inventory</h1>
            <div>
                <button onclick="loadProducts()">Refresh</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Search by ID / Desc / Size" oninput="filterProducts()">
        </div>

        <div class="add-form-box">
            <h3>Add New Product</h3>
            <input type="text" id="descInput" placeholder="Description">
            <input type="text" id="sizeInput" placeholder="Size">
            <input type="number" step="0.01" id="groupInput" placeholder="Group Price (RM)">
            <input type="number" step="0.01" id="sellInput" placeholder="Sell Price (RM)">
            <button onclick="addProduct()">Submit New Product</button>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="debug-popup" id="debugBox"></div>
</div>

<script>
    // ========= CONFIG - PASTE YOUR APPS SCRIPT WEB APP URL HERE =========
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzil0jslgcECFRvSJv_Ljjmb81G7fzwHrbOch59TcjjSzhgRsOQGQIIDBeLgTb0yKRB8g/exec";
    // ====================================================================
    let rawProductList = [];

    // Init check local login
    window.onload = function(){
        const savedUser = localStorage.getItem("invUser");
        const savedPass = localStorage.getItem("invPass");
        if(savedUser && savedPass){
            loginApi(savedUser, savedPass);
        }
    }

    function debugLog(msg){
        console.log(msg);
        const box = document.getElementById("debugBox");
        box.innerText = msg;
    }

    async function loginApi(user, pass){
        debugLog("Logging in...");
        try{
            const res = await fetch(WEB_APP_URL, {
                method:"POST",
                body:JSON.stringify({action:"login", username:user.trim(), password:pass.trim()})
            })
            const data = await res.json();
            if(data.success){
                localStorage.setItem("invUser", user);
                localStorage.setItem("invPass", pass);
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("mainView").classList.remove("hidden");
                loadProducts();
                debugLog("Login OK");
            }else{
                debugLog("Login fail: "+data.msg);
                alert("Login failed: "+data.msg);
            }
        }catch(e){
            debugLog("Login error: "+e.message);
            alert("Network error");
        }
    }

    function doLogin(){
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        loginApi(u,p);
    }

    function logout(){
        localStorage.removeItem("invUser");
        localStorage.removeItem("invPass");
        document.getElementById("mainView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
        debugLog("Logged out");
    }

    async function loadProducts(){
        debugLog("Fetching products...");
        try{
            const res = await fetch(WEB_APP_URL,{
                method:"POST",
                body:JSON.stringify({action:"getProducts"})
            })
            const data = await res.json();
            if(data.success){
                rawProductList = data.list;
                filterProducts();
                debugLog("Loaded "+rawProductList.length+" items");
            }else{
                debugLog("Load fail: "+data.msg);
            }
        }catch(e){
            debugLog("Load error: "+e.message);
        }
    }

    function filterProducts(){
        const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";
        const filtered = rawProductList.filter(item=>{
            return String(item.id).toLowerCase().includes(keyword)
                || String(item.desc).toLowerCase().includes(keyword)
                || String(item.size).toLowerCase().includes(keyword);
        })
        filtered.forEach(p=>{
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <p><strong>ID:</strong> ${p.id}</p>
                <p><strong>Desc:</strong> ${p.desc}</p>
                <p><strong>Size:</strong> ${p.size}</p>
                <p><strong>Group:</strong> RM ${Number(p.group).toFixed(2)}</p>
                <p><strong>Sell:</strong> RM ${Number(p.sell).toFixed(2)}</p>
                <button class="del-btn" onclick="deleteProduct('${p.id}')">Delete</button>
            `
            grid.appendChild(card);
        })
    }

    async function addProduct(){
        const desc = document.getElementById("descInput").value.trim();
        const size = document.getElementById("sizeInput").value.trim();
        const group = parseFloat(document.getElementById("groupInput").value);
        const sell = parseFloat(document.getElementById("sellInput").value);
        if(!desc || isNaN(group) || isNaN(sell)){
            alert("Fill all required fields correctly");
            return;
        }
        debugLog("Adding new product");
        try{
            const res = await fetch(WEB_APP_URL,{
                method:"POST",
                body:JSON.stringify({
                    action:"addProduct",
                    desc:desc,
                    size:size,
                    group:group,
                    sell:sell
                })
            })
            const data = await res.json();
            if(data.success){
                alert("Added OK");
                // clear form
                document.getElementById("descInput").value="";
                document.getElementById("sizeInput").value="";
                document.getElementById("groupInput").value="";
                document.getElementById("sellInput").value="";
                loadProducts();
            }else{
                alert("Add fail: "+data.msg);
                debugLog("Add fail: "+data.msg);
            }
        }catch(e){
            debugLog("Add error: "+e.message);
        }
    }

    async function deleteProduct(pid){
        if(!confirm("Delete this product?")) return;
        debugLog("Deleting "+pid);
        try{
            const res = await fetch(WEB_APP_URL,{
                method:"POST",
                body:JSON.stringify({action:"deleteProduct", id:pid})
            })
            const data = await res.json();
            if(data.success){
                alert("Deleted");
                loadProducts();
            }else{
                alert("Delete fail: "+data.msg);
            }
        }catch(e){
            debugLog("Delete error: "+e.message);
        }
    }
</script>
</body>
</html>
