<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #333333;
            color: #ffffff;
            padding: 16px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .hidden {
            display: none !important;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
        }
        button {
            background: #444444;
            color: #ffffff;
            border: 1px solid #888888;
            padding: 9px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover {
            background: #555555;
        }
        .login-box {
            border: 2px solid #000000;
            background: #ffffff;
            padding: 24px;
            border-radius: 8px;
            max-width: 420px;
            margin: 60px auto 0;
        }
        .login-box h2 {
            margin-bottom: 16px;
            text-align: center;
            color: #000;
        }
        .login-box input {
            width: 100%;
            background: #f5f5f5;
            border: 1px solid #666;
            color: #000;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            font-size: 15px;
        }
        .login-box button {
            background: #222;
            color: #fff;
            border: 1px solid #000;
        }
        .search-area {
            margin-bottom: 20px;
        }
        .search-area input {
            max-width: 600px;
            width:100%;
            background:#444;
            border:1px solid #888;
            color:#fff;
            padding:12px;
            border-radius:5px;
            font-size:15px;
        }
        /* 手机强制双列布局 */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }
        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 18px;
            }
        }
        .product-card {
            border: 1px solid #555555;
            background: #444444;
            color:#ffffff;
            padding: 18px;
            border-radius: 10px;
            box-shadow: 0 0 10px #00000033;
            transition: 0.25s;
        }
        .product-card:hover {
            box-shadow: 0 0 16px #00000055;
            border-color: #999;
        }
        .product-card .pid {
            font-size: 20px;
            font-weight: bold;
            word-break: break-all;
        }
        .divider {
            height: 1px;
            background-color: #888888;
            margin: 10px 0;
        }
        .product-card .desc {
            font-size:16px;
            font-weight:bold;
            margin-bottom:8px;
        }
        .product-card .size {
            font-size:14px;
            color:#eeeeee;
            margin-bottom:12px;
        }
        .price-row {
            display:flex;
            justify-content: space-between;
            font-size:15px;
            margin:6px 0;
        }
        .debug-popup {
            position: fixed;
            bottom:16px;
            right:16px;
            background:#222;
            border:1px solid #777;
            color:#fff;
            padding:12px;
            max-width:340px;
            z-index:999;
            font-size:12px;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Login View -->
    <div id="loginView">
        <div class="login-box">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="doLogin()" style="width:100%">Login</button>
        </div>
    </div>

    <!-- Main System View -->
    <div id="mainView" class="hidden">
        <div class="header-bar">
            <h1>Product Inventory</h1>
            <div>
                <button onclick="loadProducts()">Refresh</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Search by ID / Description / Size" oninput="filterProducts()">
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <div class="debug-popup" id="debugBox"></div>
</div>

<script>
    // ========= CONFIG - PASTE YOUR APPS SCRIPT WEB APP URL HERE =========
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzil0jslgcECFRvSJv_Ljjmb81G7fzwHrbOch59TcjjSzhgRsOQGQIIDBeLgTb0yKRB8g/exec";
    // ====================================================================
    let rawProductList = [];

    window.onload = function(){
        const savedUser = localStorage.getItem("invUser");
        const savedPass = localStorage.getItem("invPass");
        if(savedUser && savedPass){
            loginApi(savedUser, savedPass);
        }
    }

    function debugLog(msg){
        console.log(msg);
        const box = document.getElementById("debugBox");
        box.innerText = msg;
    }

    async function loginApi(user, pass){
        debugLog("Logging in...");
        try{
            const res = await fetch(WEB_APP_URL, {
                method:"POST",
                body:JSON.stringify({action:"login", username:user.trim(), password:pass.trim()})
            })
            const data = await res.json();
            if(data.success){
                localStorage.setItem("invUser", user);
                localStorage.setItem("invPass", pass);
                document.getElementById("loginView").classList.add("hidden");
                document.getElementById("mainView").classList.remove("hidden");
                loadProducts();
                debugLog("Login OK");
            }else{
                debugLog("Login fail: "+data.msg);
                alert("Login failed: "+data.msg);
            }
        }catch(e){
            debugLog("Login error: "+e.message);
            alert("Network error");
        }
    }

    function doLogin(){
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;
        loginApi(u,p);
    }

    function logout(){
        localStorage.removeItem("invUser");
        localStorage.removeItem("invPass");
        document.getElementById("mainView").classList.add("hidden");
        document.getElementById("loginView").classList.remove("hidden");
        debugLog("Logged out");
    }

    async function loadProducts(){
        debugLog("Fetching products...");
        try{
            const res = await fetch(WEB_APP_URL,{
                method:"POST",
                body:JSON.stringify({action:"getProducts"})
            })
            const data = await res.json();
            if(data.success){
                rawProductList = data.list;
                filterProducts();
                debugLog("Loaded "+rawProductList.length+" items");
            }else{
                debugLog("Load fail: "+data.msg);
            }
        }catch(e){
            debugLog("Load error: "+e.message);
        }
    }

    function filterProducts(){
        const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
        const grid = document.getElementById("productGrid");
        grid.innerHTML = "";
        const filtered = rawProductList.filter(item=>{
            return String(item.id).toLowerCase().includes(keyword)
                || String(item.desc).toLowerCase().includes(keyword)
                || String(item.size).toLowerCase().includes(keyword);
        })
        filtered.forEach(p=>{
            const card = document.createElement("div");
            card.className = "product-card";
            card.innerHTML = `
                <div class="pid">${p.id}</div>
                <div class="divider"></div>
                <div class="desc">${p.desc}</div>
                <div class="size">${p.size}</div>
                <div class="price-row"><span>Group</span><span>RM ${Number(p.group).toFixed(2)}</span></div>
                <div class="price-row"><span>Sell</span><span>RM ${Number(p.sell).toFixed(2)}</span></div>
            `
            grid.appendChild(card);
        })
    }
</script>
</body>
</html>
