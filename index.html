<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primaryGreen: '#009944',
            primaryRed: '#dd2222',
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #f7f7f7;
      color: #111;
    }
    /* 强制密码黑点，兼容安卓webview */
    input[type="password"] {
      -webkit-text-security: disc !important;
      text-security: disc;
    }
    input[type="text"],input[type="password"],input[type="number"]{
      color:#111 !important;
      background:#fff !important;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
  <!-- 登录页面 -->
  <div id="loginPage" class="flex justify-center items-center min-h-screen px-4">
    <div class="w-full max-w-md border-2 border-primaryGreen rounded-xl p-6 shadow-lg bg-white">
      <h2 class="text-2xl font-bold text-center mb-6 text-primaryGreen">Login</h2>
      <div class="mb-4">
        <label class="block text-gray-700 mb-1">Username</label>
        <input type="text" id="username" class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-primaryGreen">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="password" class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-primaryGreen">
      </div>
      <button onclick="doLogin()" class="w-full bg-primaryGreen text-white py-3 rounded-lg font-medium hover:opacity-90 transition">
        Sign In
      </button>
      <p id="loginTip" class="mt-3 text-primaryRed text-center hidden"></p>
    </div>
  </div>

  <!-- 产品管理主页 -->
  <div id="mainPage" class="hidden p-4 max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-xl font-bold text-primaryGreen">Product List</h1>
      <button onclick="logout()" class="bg-primaryRed text-white px-4 py-2 rounded-lg">Logout</button>
    </div>

    <!-- 🔍 搜索框 -->
    <div class="mb-4">
      <input type="text" id="searchInput" placeholder="Search by ID / Description / Size..." 
        class="w-full border border-gray-300 bg-white text-gray-900 rounded-lg px-4 py-3 outline-primaryGreen" oninput="renderProductCards()">
    </div>

    <!-- ➕ 添加产品（默认收起，Group / Sell 左右并排） -->
    <div class="mb-6">
      <button id="toggleAddBtn" onclick="toggleAddForm()" class="w-full bg-primaryGreen text-white py-3 rounded-lg font-medium">
        + Add New Product
      </button>
      <div id="addFormWrap" class="hidden mt-3 p-4 bg-white rounded-xl shadow border border-gray-200">
        <div class="grid gap-3">
          <input type="text" id="prodDesc" placeholder="Description" class="border border-gray-300 bg-white text-gray-900 rounded-lg px-3 py-2">
          <input type="text" id="prodSize" placeholder="Size" class="border border-gray-300 bg-white text-gray-900 rounded-lg px-3 py-2">
          <div class="grid grid-cols-2 gap-3">
            <input type="number" step="0.01" id="prodGroup" placeholder="Group" class="border border-gray-300 bg-white text-gray-900 rounded-lg px-3 py-2">
            <input type="number" step="0.01" id="prodSell" placeholder="Sell" class="border border-gray-300 bg-white text-gray-900 rounded-lg px-3 py-2">
          </div>
          <button onclick="addProduct()" class="bg-primaryGreen text-white py-2 rounded-lg">Save Product</button>
        </div>
      </div>
    </div>

    <!-- 📦 产品卡片容器：手机2列 -->
    <div id="productList" class="grid grid-cols-2 gap-3">
    </div>
    <p id="globalTip" class="mt-4 text-center hidden"></p>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqv3Wf0mrUfG6RyvHpHY7vbeOdKJA2JRw6PjvwhSm3oWvyQC2Ur45KLL7OozwnjL1I9A/exec";
    let productData = [];

    window.onload = () => {
      const raw = localStorage.getItem("userInfo");
      if(raw){
        try{
          JSON.parse(raw);
          showMainPage();
          loadProducts();
        }catch(e){
          localStorage.removeItem("userInfo");
          showLoginPage();
        }
      }else{
        showLoginPage();
      }
    }

    function showMainPage(){
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
    }
    function showLoginPage(){
      document.getElementById("loginPage").classList.remove("hidden");
      document.getElementById("mainPage").classList.add("hidden");
    }
    function showTip(elId, text, isError=false){
      const el = document.getElementById(elId);
      el.innerText = text;
      el.className = isError ? "mt-4 text-center text-primaryRed" : "mt-4 text-center text-primaryGreen";
      el.classList.remove("hidden");
      setTimeout(()=> el.classList.add("hidden"),2500);
    }

    function toggleAddForm(){
      const wrap = document.getElementById("addFormWrap");
      const btn = document.getElementById("toggleAddBtn");
      wrap.classList.toggle("hidden");
      btn.innerText = wrap.classList.contains("hidden") ? "+ Add New Product" : "- Close Add Form";
    }

    async function doLogin(){
      const user = document.getElementById("username").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const tipEl = document.getElementById("loginTip");
      tipEl.classList.add("hidden");
      if(!user || !pwd){
        tipEl.innerText = "Please fill username and password";
        tipEl.classList.remove("hidden");
        return;
      }
      try{
        const res = await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({action:"login", username:user, password:pwd})
        })
        const data = await res.json();
        console.log("login resp:", data);
        //兼容老登录返回
        if(data.success || data === true){
          localStorage.setItem("userInfo", JSON.stringify({username:user}));
          showMainPage();
          loadProducts();
        }else{
          tipEl.innerText = "Invalid username or password";
          tipEl.classList.remove("hidden");
        }
      }catch(err){
        tipEl.innerText = "Network error, please try again";
        tipEl.classList.remove("hidden");
        console.error(err);
      }
    }

    function logout(){
      localStorage.removeItem("userInfo");
      productData = [];
      showLoginPage();
    }

    async function loadProducts(){
      try{
        const userInfo = JSON.parse(localStorage.getItem("userInfo"));
        const res = await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({action:"getProducts", username:userInfo.username})
        })
        const data = await res.json();
        console.log("product raw resp >>>", data); // 关键调试输出！F12看这里
        // =====兼容两种格式【重点修复】=====
        let list = [];
        if(Array.isArray(data)){
          //老GS：直接返回数组
          list = data;
        }else if(data.products && Array.isArray(data.products)){
          //新格式 {success:true,products:[]}
          list = data.products;
        }
        productData = list;
        renderProductCards();
      }catch(err){
        console.error("load err",err);
        showTip("globalTip", "Failed to load product list", true);
      }
    }

    function renderProductCards(){
      const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
      const container = document.getElementById("productList");
      const filterList = productData.filter(item=>{
        return (item.id||"").toLowerCase().includes(keyword)
          || (item.desc||"").toLowerCase().includes(keyword)
          || (item.size||"").toLowerCase().includes(keyword);
      })
      if(filterList.length ===0){
        container.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400">No matching products</div>`;
        return;
      }
      let html = "";
      filterList.forEach(item=>{
        const formatNum = (val) => {
          const num = parseFloat(val || 0);
          return "RM" + num.toFixed(2);
        }
        const groupText = formatNum(item.group);
        const sellText = formatNum(item.sell);
        html += `
          <div class="bg-white rounded-xl shadow p-3 border border-gray-200 hover:shadow-md transition">
            <div class="text-xl font-bold text-gray-900 mb-2">${item.id || "-"}</div>
            <div class="border-b border-gray-300 mb-3"></div>
            <div class="font-semibold text-gray-800 mb-2">${item.desc || "-"}</div>
            <div class="text-sm text-gray-600 mb-1">Size: ${item.size || "-"}</div>
            <div class="text-sm text-gray-600 mb-1">Group: ${groupText}</div>
            <div class="text-sm text-gray-600">Sell: ${sellText}</div>
          </div>
        `
      })
      container.innerHTML = html;
    }

    async function addProduct(){
      const desc = document.getElementById("prodDesc").value.trim();
      const size = document.getElementById("prodSize").value.trim();
      const group = document.getElementById("prodGroup").value.trim();
      const sell = document.getElementById("prodSell").value.trim();
      if(!desc){
        showTip("globalTip", "Description cannot be empty", true);
        return;
      }
      try{
        const userInfo = JSON.parse(localStorage.getItem("userInfo"));
        await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({
            action:"addProduct",
            username:userInfo.username,
            desc,size,group,sell
          })
        })
        document.getElementById("prodDesc").value = "";
        document.getElementById("prodSize").value = "";
        document.getElementById("prodGroup").value = "";
        document.getElementById("prodSell").value = "";
        document.getElementById("addFormWrap").classList.add("hidden");
        document.getElementById("toggleAddBtn").innerText = "+ Add New Product";
        showTip("globalTip", "Product added successfully");
        loadProducts();
      }catch(err){
        showTip("globalTip", "Add product failed", true);
        console.error(err);
      }
    }
  </script>
</body>
</html>
