<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primaryGreen: '#009944',
            primaryRed: '#dd2222',
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100svh;
    }
  </style>
</head>
<body class="bg-white">
  <!-- 登录页面 -->
  <div id="loginPage" class="flex justify-center items-center min-h-[100svh] px-4">
    <div class="w-full max-w-md border-2 border-primaryGreen rounded-xl p-6 shadow-lg bg-white">
      <h2 class="text-[clamp(1.5rem,4vw,2rem)] font-bold text-center text-primaryGreen mb-6">Login</h2>
      <div class="mb-4">
        <label class="block text-gray-700 mb-1">Username</label>
        <input type="text" id="username" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-primaryGreen focus:ring-0 outline-none" value="admin">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="password" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:border-primaryGreen focus:ring-0 outline-none" value="123456">
      </div>
      <button onclick="doLogin()" class="w-full bg-primaryGreen text-white py-3 rounded-lg font-medium hover:bg-green-700 transition">
        Sign In
      </button>
      <p id="loginTip" class="mt-3 text-primaryRed text-center hidden"></p>
    </div>
  </div>

  <!-- 产品管理页面 -->
  <div id="mainPage" class="hidden px-4 py-6 max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-xl font-bold text-primaryGreen">Product List</h1>
      <button onclick="logout()" class="bg-primaryRed text-white px-4 py-2 rounded-lg">Logout</button>
    </div>

    <!-- 添加产品表单 -->
    <div class="border border-primaryGreen rounded-xl p-4 mb-6">
      <h3 class="font-semibold mb-3">Add New Product</h3>
      <div class="grid gap-3">
        <input type="text" id="prodDesc" placeholder="Description" class="border border-gray-300 rounded px-3 py-2 focus:border-primaryGreen focus:ring-0 outline-none">
        <input type="text" id="prodSize" placeholder="Size" class="border border-gray-300 rounded px-3 py-2 focus:border-primaryGreen focus:ring-0 outline-none">
        <input type="number" step="0.01" id="prodGroup" placeholder="Group Price" class="border border-gray-300 rounded px-3 py-2 focus:border-primaryGreen focus:ring-0 outline-none">
        <input type="number" step="0.01" id="prodSell" placeholder="Sell Price" class="border border-gray-300 rounded px-3 py-2 focus:border-primaryGreen focus:ring-0 outline-none">
        <button onclick="addProduct()" class="bg-primaryGreen text-white py-2 rounded-lg">Add Product</button>
      </div>
    </div>

    <!-- 产品卡片 -->
    <div id="productList" class="grid grid-cols-1 gap-4"></div>
    <p id="globalTip" class="mt-4 text-center hidden"></p>
  </div>

  <script>
    // 已经填入你的WebApp链接
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqv3Wf0mrUfG6RyvHpHY7vbeOdKJA2JRw6PjvwhSm3oWvyQC2Ur45KLL7OozwnjL1I9A/exec";

    window.onload = () => {
      if(localStorage.getItem("userInfo")){
        showMainPage();
        loadProducts();
      }
    }

    function showMainPage(){
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
    }
    function showLoginPage(){
      document.getElementById("loginPage").classList.remove("hidden");
      document.getElementById("mainPage").classList.add("hidden");
    }
    function showTip(text, isError=false){
      const tipEl = document.getElementById("globalTip");
      tipEl.innerText = text;
      tipEl.className = isError ? "mt-4 text-center text-primaryRed" : "mt-4 text-center text-primaryGreen";
      tipEl.classList.remove("hidden");
      setTimeout(()=>tipEl.classList.add("hidden"),2500);
    }

    async function doLogin(){
      const user = document.getElementById("username").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const tip = document.getElementById("loginTip");
      tip.classList.add("hidden");
      if(!user || !pwd){
        tip.innerText = "Please fill username and password";
        tip.classList.remove("hidden");
        return;
      }
      try{
        const res = await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({action:"login", username:user, password:pwd})
        })
        const data = await res.json();
        if(data.success){
          localStorage.setItem("userInfo", JSON.stringify({username:user}));
          showMainPage();
          loadProducts();
        }else{
          tip.innerText = "Invalid username or password";
          tip.classList.remove("hidden");
        }
      }catch(err){
        tip.innerText = "Network error, please try again";
        tip.classList.remove("hidden");
        console.error(err);
      }
    }

    function logout(){
      localStorage.removeItem("userInfo");
      showLoginPage();
    }

    async function loadProducts(){
      try{
        const userInfo = JSON.parse(localStorage.getItem("userInfo")||"{}");
        const res = await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({action:"getProducts", username:userInfo.username})
        })
        const data = await res.json();
        if(!data.success){
          logout();
          return;
        }
        const list = data.products;
        const container = document.getElementById("productList");
        container.innerHTML = "";
        list.forEach(item => {
          const card = document.createElement("div");
          card.className = "border border-gray-200 rounded-xl p-4 shadow-sm bg-white";
          card.innerHTML = `
            <div class="font-bold text-lg text-primaryGreen mb-2">${item.desc}</div>
            <div class="text-gray-600 mb-2">Size: ${item.size || "-"}</div>
            <div class="text-sm mb-1">Group Price: ${item.group}</div>
            <div class="text-sm mb-3">Sell Price: ${item.sell}</div>
            <button onclick="delProduct('${item.id}')" class="bg-primaryRed text-white px-3 py-1 rounded w-full">Delete</button>
          `
          container.appendChild(card);
        })
      }catch(err){
        showTip("Failed to load product list", true);
        console.error(err);
      }
    }

    async function addProduct(){
      const desc = document.getElementById("prodDesc").value.trim();
      const size = document.getElementById("prodSize").value.trim();
      const group = document.getElementById("prodGroup").value;
      const sell = document.getElementById("prodSell").value;
      if(!desc){
        showTip("Description cannot be empty", true);
        return;
      }
      try{
        const userInfo = JSON.parse(localStorage.getItem("userInfo")||"{}");
        await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({
            action:"addProduct",
            username:userInfo.username,
            desc,size,group,sell
          })
        })
        document.getElementById("prodDesc").value = "";
        document.getElementById("prodSize").value = "";
        document.getElementById("prodGroup").value = "";
        document.getElementById("prodSell").value = "";
        showTip("Product added successfully");
        loadProducts();
      }catch(err){
        showTip("Add product failed", true);
        console.error(err);
      }
    }

    async function delProduct(id){
      if(!confirm("Confirm delete this product?")) return;
      try{
        const userInfo = JSON.parse(localStorage.getItem("userInfo")||"{}");
        await fetch(SCRIPT_URL, {
          method:"POST",
          body:JSON.stringify({
            action:"delProduct",
            username:userInfo.username,
            id
          })
        })
        showTip("Product deleted");
        loadProducts();
      }catch(err){
        showTip("Delete failed", true);
        console.error(err);
      }
    }
  </script>
</body>
</html>
