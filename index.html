<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primaryGreen: '#009944',
            primaryRed: '#dd2222',
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #000000;
    }
  </style>
</head>
<body class="bg-black min-h-screen text-white">
  <!-- 登录页面 -->
  <div id="loginPage" class="flex justify-center items-center min-h-screen px-4">
    <div class="w-full max-w-md border-2 border-primaryGreen rounded-xl p-6 shadow-lg bg-white">
      <h2 class="text-2xl font-bold text-center mb-6 text-primaryGreen">Login</h2>
      <div class="mb-4">
        <label class="block text-gray-700 mb-1">Username</label>
        <input type="text" id="username" class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-primaryGreen">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-1">Password</label>
        <input type="password" id="password" class="w-full border border-gray-300 rounded-lg px-4 py-3 outline-primaryGreen">
      </div>
      <button onclick="doLogin()" class="w-full bg-primaryGreen text-white py-3 rounded-lg font-medium hover:opacity-90 transition">
        Sign In
      </button>
      <p id="loginTip" class="mt-3 text-primaryRed text-center hidden"></p>
    </div>
  </div>
  <!-- 产品管理主页 -->
  <div id="mainPage" class="hidden p-4 max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-4 gap-2">
      <h1 class="text-xl font-bold text-primaryGreen">Product List</h1>
      <div class="flex gap-2">
        <button onclick="loadProducts()" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Refresh</button>
        <button onclick="logout()" class="bg-primaryRed text-white px-4 py-2 rounded-lg">Logout</button>
      </div>
    </div>
    <!-- 🔍 搜索框 -->
    <div class="mb-4">
      <input type="text" id="searchInput" placeholder="Search by ID / Description / Size..." 
        class="w-full border border-gray-600 bg-gray-900 text-white rounded-lg px-4 py-3 outline-primaryGreen" oninput="renderProductCards()">
    </div>
    <!-- ➕ 添加产品 -->
    <div class="mb-6">
      <button id="toggleAddBtn" onclick="toggleAddForm()" class="w-full bg-primaryGreen text-white py-3 rounded-lg font-medium">
        + Add New Product
      </button>
      <div id="addFormWrap" class="hidden mt-3 p-4 bg-gray-900 rounded-xl shadow border border-gray-700">
        <div class="grid gap-3">
          <input type="text" id="prodDesc" placeholder="Description" class="border border-gray-600 bg-gray-800 text-white rounded-lg px-3 py-2">
          <input type="text" id="prodSize" placeholder="Size" class="border border-gray-600 bg-gray-800 text-white rounded-lg px-3 py-2">
          <div class="grid grid-cols-2 gap-3">
            <input type="number" step="0.01" id="prodGroup" placeholder="Group" class="border border-gray-600 bg-gray-800 text-white rounded-lg px-3 py-2">
            <input type="number" step="0.01" id="prodSell" placeholder="Sell" class="border border-gray-600 bg-gray-800 text-white rounded-lg px-3 py-2">
          </div>
          <button onclick="addProduct()" class="bg-primaryGreen text-white py-2 rounded-lg">Save Product</button>
        </div>
      </div>
    </div>
    <!-- 📦 产品卡片 -->
    <div id="productList" class="grid grid-cols-2 gap-3">
      <div class="col-span-full text-center py-8 text-gray-400">Ready</div>
    </div>
    <p id="globalTip" class="mt-4 text-center hidden"></p>
  </div>
  <script>
    // ⚠️ 替换成你新部署后的WebApp链接
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiL3hJ1_875VJ01rMUpjSaQmNq8ErZ-SHgUlt8E04znL3z4r9QljsCVlU5ZfJKF1-BRA/exec";
    let productData = [];

    window.onload = () => {
      if(localStorage.getItem("userInfo")){
        showMainPage();
        loadProducts();
      }
    }
    function showMainPage(){
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
    }
    function showLoginPage(){
      document.getElementById("loginPage").classList.remove("hidden");
      document.getElementById("mainPage").classList.add("hidden");
    }
    function showTip(elId, text, isError=false){
      const el = document.getElementById(elId);
      el.innerText = text;
      el.className = isError ? "mt-4 text-center text-primaryRed" : "mt-4 text-center text-primaryGreen";
      el.classList.remove("hidden");
      setTimeout(()=> el.classList.add("hidden"),2500);
    }
    function toggleAddForm(){
      const wrap = document.getElementById("addFormWrap");
      const btn = document.getElementById("toggleAddBtn");
      wrap.classList.toggle("hidden");
      btn.innerText = wrap.classList.contains("hidden") ? "+ Add New Product" : "- Close Add Form";
    }

    async function apiRequest(payload){
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      const rawText = await res.text();
      try{
        return JSON.parse(rawText);
      }catch(e){
        console.error("接口返回不是JSON：", rawText);
        return {success:false, msg:"接口返回数据异常"};
      }
    }

    async function doLogin(){
      const user = document.getElementById("username").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const tipEl = document.getElementById("loginTip");
      tipEl.classList.add("hidden");
      if(!user || !pwd){
        tipEl.innerText = "Please fill username and password";
        tipEl.classList.remove("hidden");
        return;
      }
      try{
        const data = await apiRequest({action:"login", username:user, password:pwd});
        if(data.success){
          localStorage.setItem("userInfo", JSON.stringify({username:user}));
          showMainPage();
          loadProducts();
        }else{
          tipEl.innerText = data.msg || "Invalid username or password";
          tipEl.classList.remove("hidden");
        }
      }catch(err){
        tipEl.innerText = "Network error, please try again";
        tipEl.classList.remove("hidden");
        console.error(err);
      }
    }
    function logout(){
      localStorage.removeItem("userInfo");
      productData = [];
      showLoginPage();
    }
    async function loadProducts(){
      try{
        document.getElementById("productList").innerHTML = `<div class="col-span-full text-center py-8 text-gray-400">Loading...</div>`;
        const userInfo = JSON.parse(localStorage.getItem("userInfo"));
        const data = await apiRequest({action:"getProducts", username:userInfo.username});
        if(!data.success){
          showTip("globalTip", data.msg || "Load failed", true);
          return;
        }
        productData = data.products || [];
        renderProductCards();
      }catch(err){
        document.getElementById("productList").innerHTML = `<div class="col-span-full text-center py-8 text-red-400">Load Error</div>`;
        showTip("globalTip", "Failed to load product list", true);
        console.error(err);
      }
    }
    function renderProductCards(){
      const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
      const container = document.getElementById("productList");
      const filterList = productData.filter(item=>{
        return (item.id||"").toLowerCase().includes(keyword)
          || (item.desc||"").toLowerCase().includes(keyword)
          || (item.size||"").toLowerCase().includes(keyword);
      })
      if(filterList.length ===0){
        container.innerHTML = `<div class="col-span-full text-center py-8 text-gray-400">No matching products</div>`;
        return;
      }
      let html = "";
      filterList.forEach(item=>{
        const formatNum = (val) => {
          const num = parseFloat(val || 0);
          return "RM" + num.toFixed(2);
        }
        const groupText = formatNum(item.group);
        const sellText = formatNum(item.sell);
        html += `
          <div class="bg-gray-900 rounded-xl shadow p-3 border border-gray-700 hover:shadow-md transition">
            <div class="text-xl font-bold text-white mb-2">${item.id || "-"}</div>
            <div class="border-b border-gray-600 mb-3"></div>
            <div class="font-semibold text-gray-200 mb-2">${item.desc || "-"}</div>
            <div class="text-sm text-gray-400 mb-1">Size: ${item.size || "-"}</div>
            <div class="text-sm text-gray-400 mb-1">Group: ${groupText}</div>
            <div class="text-sm text-gray-400">Sell: ${sellText}</div>
          </div>
        `
      })
      container.innerHTML = html;
    }
    async function addProduct(){
      const desc = document.getElementById("prodDesc").value.trim();
      const size = document.getElementById("prodSize").value.trim();
      const group = document.getElementById("prodGroup").value.trim();
      const sell = document.getElementById("prodSell").value.trim();
      if(!desc){
        showTip("globalTip", "Description cannot be empty", true);
        return;
      }
      try{
        const userInfo = JSON.parse(localStorage.getItem("userInfo"));
        const data = await apiRequest({
          action:"addProduct",
          username:userInfo.username,
          desc,size,group,sell
        })
        if(data.success){
          document.getElementById("prodDesc").value = "";
          document.getElementById("prodSize").value = "";
          document.getElementById("prodGroup").value = "";
          document.getElementById("prodSell").value = "";
          document.getElementById("addFormWrap").classList.add("hidden");
          document.getElementById("toggleAddBtn").innerText = "+ Add New Product";
          showTip("globalTip", "Product added successfully");
          loadProducts();
        }else{
          showTip("globalTip", data.msg || "Add product failed", true);
        }
      }catch(err){
        showTip("globalTip", "Add product failed", true);
        console.error(err);
      }
    }
  </script>
</body>
</html>
